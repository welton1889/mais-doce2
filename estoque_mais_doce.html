<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mais Doce - Estoque</title>
<style>
:root{--rosa:#f8c8d8;--rosa2:#fde8ef;--rosa3:#e58fae;--vinho:#8a4a62;--branco:#fff;--ok:#5aa874;--erro:#d9435f}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--rosa2);color:#5a3a46}
header{background:var(--rosa);display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:4px solid var(--rosa3)}
header img{height:90px;border-radius:12px;background:#fff;padding:4px}
header h1{margin:0;color:var(--vinho);font-size:1.6rem}
header p{margin:2px 0 0;font-size:.9rem}
main{max-width:1100px;margin:20px auto;padding:0 14px;display:grid;gap:20px;grid-template-columns:340px 1fr}
@media(max-width:850px){main{grid-template-columns:1fr}}
.card{background:var(--branco);border-radius:18px;padding:18px;box-shadow:0 4px 14px #e58fae33}
h2{margin:0 0 12px;color:var(--vinho);font-size:1.1rem}
label{display:block;font-size:.8rem;margin:10px 0 3px;font-weight:600}
input,select{width:100%;padding:10px;border:2px solid var(--rosa);border-radius:10px;font-size:.95rem;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--rosa3)}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:10px;border:2px solid var(--rosa);background:#fff;border-radius:10px;font-weight:700;cursor:pointer;color:var(--vinho)}
.tabs button.on{background:var(--rosa3);color:#fff;border-color:var(--rosa3)}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--rosa3);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.btn.sec{background:var(--rosa);color:var(--vinho)}
.btn:hover{filter:brightness(.95)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:var(--rosa);color:var(--vinho);text-align:left;padding:8px}
td{padding:8px;border-bottom:1px solid var(--rosa2)}
tr.venc td{background:#ffe3e8;color:var(--erro);font-weight:600}
.tw{overflow-x:auto}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--vinho);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
.mode{font-size:.75rem;padding:4px 10px;border-radius:12px;background:#fff;display:inline-block;margin-top:4px}
</style></head><body>

<div><h1>Controle de Estoque</h1><p>Mais Doce 🍫</p><span class="mode" id="mode"></span></div></header>
<main>
<section class="card">
<h2>Movimentação</h2>
<div class="tabs"><button id="tE" class="on" type="button">⬆ Entrada</button><button id="tS" type="button">⬇ Saída</button></div>

<div id="boxE">
<label>Tipo do produto</label>
<select id="tipo"></select>
<label>Marca</label><input id="marca" placeholder="Ex.: Nestlé">
<label>Sabor</label>
<select id="sabor"></select>
<input id="saborNovo" placeholder="Digite o novo sabor" style="display:none;margin-top:6px">
<label>Validade</label><input id="validade" type="date">
</div>

<div id="boxS" style="display:none">
<label>Produto em estoque</label><select id="item"></select>
</div>

<label>Quantidade</label><input id="qtd" type="number" min="1" value="1">
<button class="btn" id="salvar" type="button">Registrar entrada</button>
<button class="btn sec" id="checar" type="button">📧 Verificar vencidos e avisar</button>
</section>

<section class="card">
<h2>Estoque atual</h2>
<div class="tw"><table><thead><tr><th>Tipo</th><th>Marca</th><th>Sabor</th><th>Qtd</th><th>Validade</th></tr></thead><tbody id="lista"></tbody></table></div>
</section>
</main>
<div id="msg"></div>
<script>
/* Cole aqui a URL do Apps Script (veja as instruções). Vazio = modo local de teste. */
const API_URL="";
const TIPOS=["Chocolate","Bolo","Doce","Sorvete","Bebida","Cobertura","Embalagem","Outro"];
const SABORES=["Sem sabor","Chocolate","Morango","Baunilha","Limão","Coco","Maracujá","Brigadeiro","Outro (digitar)"];
const $=id=>document.getElementById(id);
let itens=[],modo="E";
const hoje=()=>new Date().toISOString().slice(0,10);

function msg(t){const m=$("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",3500)}
function opts(el,arr){el.innerHTML=arr.map(a=>`<option>${a}</option>`).join("")}
opts($("tipo"),TIPOS);opts($("sabor"),SABORES);
$("mode").textContent=API_URL?"🟢 Conectado à planilha Google":"🟡 Modo local (sem planilha)";
$("sabor").onchange=()=>{$("saborNovo").style.display=$("sabor").value.startsWith("Outro")?"block":"none"};

function aba(m){modo=m;$("tE").classList.toggle("on",m=="E");$("tS").classList.toggle("on",m=="S");
$("boxE").style.display=m=="E"?"block":"none";$("boxS").style.display=m=="S"?"block":"none";
$("salvar").textContent=m=="E"?"Registrar entrada":"Registrar saída"}
$("tE").onclick=()=>aba("E");$("tS").onclick=()=>aba("S");

async function api(body){
 const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});
 return r.json();
}
async function carregar(){
 try{
  if(API_URL){itens=(await (await fetch(API_URL+"?action=list")).json()).itens}
  else{itens=JSON.parse(localStorage.getItem("estoque")||"[]")}
 }catch(e){msg("Erro ao carregar estoque");itens=[]}
 desenhar();
}
function desenhar(){
 const l=itens.filter(i=>i.qtd>0);
 $("lista").innerHTML=l.length?l.map(i=>`<tr class="${i.validade&&i.validade<hoje()?"venc":""}"><td>${i.tipo}</td><td>${i.marca}</td><td>${i.sabor}</td><td>${i.qtd}</td><td>${i.validade?i.validade.split("-").reverse().join("/"):"-"}${i.validade&&i.validade<hoje()?" ⚠ VENCIDO":""}</td></tr>`).join(""):`<tr><td colspan="5">Estoque vazio</td></tr>`;
 $("item").innerHTML=l.map((i,n)=>`<option value="${n}">${i.tipo} • ${i.marca} • ${i.sabor} • val ${i.validade||"-"} (${i.qtd})</option>`).join("");
}
$("salvar").onclick=async()=>{
 const q=parseInt($("qtd").value);if(!q||q<1)return msg("Informe a quantidade");
 let p;
 if(modo=="E"){
  const marca=$("marca").value.trim();if(!marca)return msg("Informe a marca");
  let sabor=$("sabor").value;
  if(sabor.startsWith("Outro")){sabor=$("saborNovo").value.trim();if(!sabor)return msg("Digite o sabor")}
  p={tipo:$("tipo").value,marca,sabor,validade:$("validade").value};
 }else{
  const l=itens.filter(i=>i.qtd>0),i=l[$("item").value];if(!i)return msg("Selecione um produto");
  if(q>i.qtd)return msg("Quantidade maior que o estoque");
  p={tipo:i.tipo,marca:i.marca,sabor:i.sabor,validade:i.validade};
 }
 const mov={action:"move",mov:modo=="E"?"Entrada":"Saída",...p,qtd:q};
 try{
  if(API_URL){const r=await api(mov);if(!r.ok)throw 0}
  else{
   let x=itens.find(i=>i.tipo==p.tipo&&i.marca==p.marca&&i.sabor==p.sabor&&i.validade==p.validade);
   if(!x){x={...p,qtd:0};itens.push(x)}
   x.qtd+=modo=="E"?q:-q;localStorage.setItem("estoque",JSON.stringify(itens));
  }
  msg(modo=="E"?"Entrada registrada ✔":"Saída registrada ✔");
  await carregar();$("qtd").value=1;
 }catch(e){msg("Erro ao salvar")}
};

 if(!API_URL)return msg("Conecte a planilha para enviar e-mails");
 try{const r=await api({action:"check"});msg(r.enviados?`E-mail enviado (${r.enviados} item(ns) vencido(s))`:"Nenhum item vencido novo")}
 catch(e){msg("Erro ao verificar")}
};
